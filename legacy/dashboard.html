<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Agent - Smart Inbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            /* Dark theme semantic tokens — AI-Native palette (inbox blue on deep slate) */
            --bg: #0a101f;
            --surface: #111a2c;
            --surface-2: #1a2540;
            --text: #e6edf7;
            --text-muted: #94a3b8;
            --border: #1e2a44;
            --border-strong: #2c3a5c;
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-tint: rgba(59, 130, 246, 0.12);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --accent: #8b5cf6;
            /* Legacy aliases, dark-tuned so existing rules keep working */
            --dark: #e6edf7;      /* was near-black text; now light text on dark */
            --darker: #f1f5f9;
            --light: #111a2c;     /* was light bg; now dark surface */
            --lighter: #1a2540;   /* was light hover bg; now dark hover surface */
            --gray: #94a3b8;      /* was #6b7280; now muted text on dark */
            --gray-dark: #7f8ea3;
            /* Spacing scale (4px base) */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;
            --space-7: 48px;
            /* Type scale */
            --text-xs: 0.75rem;
            --text-sm: 0.875rem;
            --text-base: 1rem;
            --text-lg: 1.125rem;
            --text-xl: 1.5rem;
            /* Radii */
            --radius-sm: 6px;
            --radius: 8px;
            --radius-md: 10px;
            --radius-lg: 14px;
            /* Layered shadows */
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow: 0 2px 6px rgba(0,0,0,0.35);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
            --transition: 0.2s ease;
            --transition-slow: 0.3s ease;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            color-scheme: dark;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        ::selection {
            background: rgba(59, 130, 246, 0.35);
            color: var(--text);
        }

        /* Visible keyboard focus rings on every interactive control */
        :focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
            border-radius: var(--radius-sm);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }
        
        header {
            background: var(--surface);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-5);
            margin-bottom: var(--space-5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-4);
            position: relative;
            overflow: hidden;
        }

        /* Soft ambient glow — AI-native accent without decoration */
        header::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -10%;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.14) 0%, transparent 65%);
            pointer-events: none;
        }

        h1 {
            background: linear-gradient(135deg, var(--text) 0%, var(--text) 55%, var(--primary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: var(--text-xl);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.2;
        }

        .stats {
            display: flex;
            gap: var(--space-3);
            font-size: var(--text-sm);
            color: var(--gray-dark);
            flex-wrap: wrap;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.4rem 0.9rem;
            transition: var(--transition);
        }

        .stat:hover {
            border-color: var(--border-strong);
        }

        .stat-label {
            color: var(--gray-dark);
            font-size: var(--text-xs);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 600;
        }

        .stat-value {
            font-weight: 700;
            color: var(--dark);
            font-variant-numeric: tabular-nums;
            min-width: 1.5rem;
            text-align: center;
        }

        .auth-status {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            background: var(--surface-2);
            padding: 0.6rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .auth-status.connected {
            border-color: rgba(16, 185, 129, 0.5);
            background-color: rgba(16, 185, 129, 0.1);
        }

        .auth-status.disconnected {
            border-color: rgba(239, 68, 68, 0.5);
            background-color: rgba(239, 68, 68, 0.1);
        }

        .auth-status-text {
            font-size: var(--text-sm);
            color: var(--text);
            font-weight: 500;
        }
        
        .auth-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .auth-btn:hover {
            background: var(--primary-dark);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
        }

        .auth-btn:active {
            transform: translateY(1px);
        }

        .auth-btn:disabled {
            background: #334155;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .controls {
            display: flex;
            gap: var(--space-3);
            flex-wrap: wrap;
            margin-bottom: var(--space-5);
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 0.65rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            background: var(--surface-2);
            color: var(--text);
            transition: var(--transition);
        }

        .search-box::placeholder {
            color: var(--text-muted);
        }

        .search-box:hover {
            border-color: var(--border-strong);
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .filter-btn, .action-btn {
            padding: 0.65rem 1.15rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .filter-btn:active, .action-btn:active {
            transform: translateY(1px);
        }

        .filter-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .filter-btn:hover {
            background: var(--lighter);
            color: var(--text);
            border-color: var(--border-strong);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
        }

        .action-btn {
            background: var(--success);
            color: white;
        }

        .action-btn:hover {
            background: #059669;
        }

        .action-btn.secondary {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .action-btn.secondary:hover {
            background: var(--border);
        }
        
        .email-list {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .email-item {
            display: flex;
            align-items: flex-start;
            padding: var(--space-5);
            border-bottom: 1px solid var(--border);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }

        .email-item:last-child {
            border-bottom: none;
        }

        .email-item:hover {
            background: var(--lighter);
        }

        .email-item.unread {
            background: rgba(59, 130, 246, 0.08);
            border-left: 3px solid var(--primary);
        }

        .email-item.important {
            border-left: 3px solid var(--warning);
        }

        .email-item.unread.important {
            border-left: 3px solid var(--danger);
        }

        .email-checkbox {
            width: 1.25rem;
            height: 1.25rem;
            margin-top: 0.25rem;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .email-content {
            flex: 1;
            margin-left: var(--space-4);
        }

        .email-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--space-2);
            flex-wrap: wrap;
            gap: var(--space-2);
        }

        .email-subject {
            font-weight: 600;
            font-size: var(--text-base);
            color: var(--dark);
            flex: 1;
            min-width: 150px;
            letter-spacing: -0.005em;
        }

        .email-from {
            color: var(--gray);
            font-size: var(--text-sm);
        }

        .email-date {
            font-size: var(--text-xs);
            color: var(--gray-dark);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .email-snippet {
            color: var(--gray-dark);
            margin-bottom: var(--space-3);
            line-height: 1.5;
            flex: 1;
            min-width: 200px;
        }

        .email-tags {
            display: flex;
            gap: var(--space-2);
            flex-wrap: wrap;
        }

        .tag {
            font-size: var(--text-xs);
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        .tag.importance {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .tag.unread {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .tag.starred {
            background: rgba(251, 146, 60, 0.15);
            color: #fdba74;
            border: 1px solid rgba(251, 146, 60, 0.4);
        }

        .tag.label {
            background: rgba(129, 140, 248, 0.15);
            color: #a5b4fc;
            border: 1px solid rgba(129, 140, 248, 0.4);
        }

        .email-actions {
            display: flex;
            gap: var(--space-2);
            margin-top: var(--space-3);
            flex-wrap: wrap;
        }

        .email-actions button {
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
            font-size: var(--text-sm);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: var(--transition);
            font-family: inherit;
        }

        .email-actions button:hover {
            background: var(--border);
            color: var(--dark);
        }

        .email-actions button:active {
            transform: translateY(1px);
        }

        .email-actions button.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--gray);
        }

        .empty-state {
            text-align: center;
            padding: 3.5rem 3rem;
            color: var(--gray-dark);
        }

        .empty-state-icon {
            font-size: 3.5rem;
            margin-bottom: var(--space-4);
            opacity: 0.4;
            line-height: 1;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.72);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            padding: var(--space-5);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: var(--text-lg);
            font-weight: 600;
            color: var(--dark);
            letter-spacing: -0.01em;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            line-height: 1;
            color: var(--gray);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .modal-close:hover {
            background: var(--lighter);
            color: var(--text);
        }

        .modal-body {
            padding: var(--space-5);
        }

        .btn-group {
            display: flex;
            gap: var(--space-4);
            margin-top: 1.5rem;
            justify-content: flex-end;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            font-family: inherit;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
        }

        .btn-secondary {
            background: var(--light);
            color: var(--dark);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--lighter);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border-strong);
            padding: 1rem 1.5rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease;
            max-width: 360px;
        }

        .toast.success {
            background: var(--success);
            color: white;
        }

        .toast.error {
            background: var(--danger);
            color: white;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        /* ============ New component styles (dark theme additions) ============ */

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .model-badge {
            display: none; /* shown by JS when /api/config reports a model */
            font-size: var(--text-xs);
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--text-muted);
            border: 1px solid var(--border);
            white-space: nowrap;
            letter-spacing: 0.01em;
            font-weight: 600;
        }

        /* Live indicator dot — only visible once JS shows the badge */
        .model-badge::before {
            content: '';
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            margin-right: 0.45rem;
            vertical-align: middle;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
        }

        .model-badge:empty::before {
            display: none;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
            gap: 1.5rem;
            align-items: start;
        }

        .detail-pane {
            display: none; /* shown once an email is selected */
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            max-height: 80vh;
            overflow-y: auto;
        }

        .detail-meta {
            padding-bottom: var(--space-4);
            border-bottom: 1px solid var(--border);
            margin-bottom: var(--space-4);
        }

        .detail-subject {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
            line-height: 1.4;
            letter-spacing: -0.01em;
        }

        .detail-from,
        .detail-date {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 0.2rem;
        }

        .detail-body {
            color: var(--text);
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: var(--space-4);
        }

        .importance-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: var(--space-4);
        }

        .detail-muted {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-style: italic;
        }

        .summary-panel {
            margin-top: 0.5rem;
            padding: 1.1rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            position: relative;
            overflow: hidden;
        }

        /* AI accent edge — subtle ambient line, no decoration */
        .summary-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, var(--primary), transparent);
            opacity: 0.7;
        }

        .summary-panel h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .summary-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.55;
        }

        .summary-unavailable {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-style: italic;
        }

        .key-points {
            margin: 0.75rem 0 0;
            padding-left: 1.25rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .key-points li {
            margin-bottom: 0.35rem;
        }

        .key-points li::marker {
            color: var(--primary);
        }

        .summary-loading {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin: 0.75rem 0 0.25rem;
        }

        .summary-loading .skeleton {
            height: 14px;
            width: 100%;
        }

        .summary-loading .skeleton:nth-child(2) { width: 85%; }
        .summary-loading .skeleton:nth-child(3) { width: 60%; }

        .suggested-action {
            margin-top: 0.75rem;
            padding: 0.55rem 0.8rem;
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            line-height: 1.45;
        }

        .smart-reply-block {
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
        }

        .smart-reply-block h3 {
            font-size: var(--text-base);
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.75rem;
        }

        .tone-select {
            width: 100%;
            padding: 0.6rem 0.75rem;
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
        }

        .tone-select:hover {
            border-color: var(--border-strong);
        }

        .tone-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .draft-reply-btn {
            width: 100%;
            margin-top: 0.75rem;
        }

        .score-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.35);
            cursor: help;
            font-variant-numeric: tabular-nums;
            transition: var(--transition);
        }

        .score-chip:hover {
            filter: brightness(1.2);
            transform: translateY(-1px);
        }

        .score-chip.mid {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border-color: rgba(245, 158, 11, 0.35);
        }

        .score-chip.low {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.35);
        }

        .llm-badge {
            position: relative;
            display: inline-flex;
            align-items: center;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            padding: 0.15rem 0.55rem;
            border-radius: 999px;
            background: rgba(139, 92, 246, 0.15);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.35);
            cursor: help;
        }

        .llm-badge:hover::after,
        .reason-tooltip:hover::after {
            content: attr(data-reason);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            z-index: 60;
            width: max-content;
            max-width: 280px;
            padding: 0.5rem 0.75rem;
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border-strong);
            box-shadow: var(--shadow-lg);
            font-size: 0.75rem;
            font-weight: 400;
            line-height: 1.45;
            white-space: normal;
            letter-spacing: normal;
            pointer-events: none;
        }

        .reason-tooltip {
            position: relative;
            cursor: help;
        }

        /* Active email row highlight */
        .email-item.selected {
            background: rgba(59, 130, 246, 0.14);
            box-shadow: inset 3px 0 0 var(--primary);
        }

        .email-item.selected:hover {
            background: rgba(59, 130, 246, 0.18);
        }

        .email-item.analyzing .email-content {
            animation: analyzePulse 1.2s ease-in-out infinite;
        }

        @keyframes analyzePulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 0.9; }
        }

        /* Skeleton shimmer */
        @keyframes shimmer {
            0% { background-position: -400px 0; }
            100% { background-position: 400px 0; }
        }

        .skeleton {
            background: linear-gradient(90deg, var(--surface-2) 25%, #24304a 37%, var(--surface-2) 63%);
            background-size: 800px 100%;
            animation: shimmer 1.4s ease infinite;
            border-radius: var(--radius-sm);
        }

        .skeleton-row {
            height: 64px;
            margin-bottom: 0.75rem;
            border-radius: var(--radius-md);
            background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 37%, var(--surface) 63%);
            background-size: 800px 100%;
            animation: shimmer 1.4s ease infinite;
        }

        .skeleton-row:last-child {
            margin-bottom: 0;
        }

        #loadingState {
            padding: 1rem;
            text-align: left;
        }

        /* Dark-tuned form controls used by the reply modal */
        .form-label {
            display: block;
            margin-bottom: 0.35rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 0.6rem 0.75rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text);
            font-size: var(--text-sm);
            font-family: inherit;
            transition: var(--transition);
        }

        .form-control:hover {
            border-color: var(--border-strong);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-check-input {
            accent-color: var(--primary);
            width: 1rem;
            height: 1rem;
            cursor: pointer;
        }

        .mb-3 {
            margin-bottom: 1rem;
        }

        .text-sm {
            font-size: 0.875rem;
        }

        .text-gray-500 {
            color: var(--text-muted);
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            background: var(--surface-2);
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        }

        /* Slim, unobtrusive scrollbars */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--surface-2);
            border: 2px solid var(--bg);
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border);
        }

        /* Motion discipline — respect reduced-motion preference */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0.5rem;
            }
            
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .stats {
                flex-wrap: wrap;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .search-box {
                width: 100%;
            }
            
            .email-item {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .email-content {
                margin-left: 0;
                margin-top: 1rem;
                width: 100%;
            }

            .layout-grid {
                grid-template-columns: 1fr;
            }

            .header-actions {
                flex-direction: column;
                align-items: flex-start;
                width: 100%;
            }

            .detail-pane {
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Email Agent</h1>
                <p class="text-sm text-gray-500">Smart inbox with AI-powered prioritization</p>
            </div>
            <div class="header-actions">
                <span class="model-badge" id="modelBadge">AI off</span>
                <div class="auth-status" id="authStatus">
                    <div class="auth-status-text">Status: <span id="authStatusText">Checking...</span></div>
                    <button class="auth-btn" id="authBtn">Connect Account</button>
                </div>
            </div>
        </header>
        
        <div class="stats" id="stats">
            <div class="stat">
                <span class="stat-label">Unread:</span>
                <span class="stat-value" id="unreadCount">-</span>
            </div>
            <div class="stat">
                <span class="stat-label">Important:</span>
                <span class="stat-value" id="importantCount">-</span>
            </div>
            <div class="stat">
                <span class="stat-label">Total:</span>
                <span class="stat-value" id="totalCount">-</span>
            </div>
        </div>
        
        <div class="controls">
            <input type="text" class="search-box" id="searchInput" placeholder="Search emails...">
            <button class="filter-btn" id="filterAll">All</button>
            <button class="filter-btn" id="filterUnread">Unread</button>
            <button class="filter-btn" id="filterImportant">Important</button>
            <button class="filter-btn" id="filterStarred">Starred</button>
            <button class="action-btn" id="refreshBtn">🔄 Refresh</button>
            <button class="action-btn" id="refreshImportanceBtn">✨ Analyze</button>
        </div>
        
        <div class="layout-grid">
            <div class="email-list" id="emailList">
                <div class="loading" id="loadingState">
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                    <div class="skeleton-row"></div>
                </div>
                <div class="empty-state" id="emptyState" style="display: none;">
                    <div class="empty-state-icon">📭</div>
                    <p>No emails found</p>
                    <p>Try adjusting your filters or check your connection.</p>
                </div>
            </div>

            <aside class="detail-pane" id="detailPane">
                <div class="detail-meta" id="detailMeta">
                    <div class="detail-subject" id="detailSubject">Select an email to view details</div>
                    <div class="detail-from" id="detailFrom"></div>
                    <div class="detail-date" id="detailDate"></div>
                </div>
                <div class="importance-row" id="detailImportance"></div>
                <div class="detail-body" id="detailBody"></div>

                <section class="summary-panel" id="summaryPanel">
                    <h3><span class="llm-badge" data-reason="Generated by the local AI model">AI</span> Summary</h3>
                    <div class="summary-loading" id="summaryLoading">
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                    </div>
                    <div class="summary-text" id="summaryText"></div>
                    <ul class="key-points" id="keyPointsList"></ul>
                    <div id="suggestedAction"></div>
                </section>

                <div class="smart-reply-block">
                    <h3>Smart Reply</h3>
                    <label class="form-label" for="toneSelect">Tone</label>
                    <select id="toneSelect" class="tone-select">
                        <option value="professional">Professional</option>
                        <option value="friendly">Friendly</option>
                        <option value="concise">Concise</option>
                        <option value="formal">Formal</option>
                    </select>
                    <button class="btn btn-primary draft-reply-btn" id="draftReplyBtn">✨ Draft Reply</button>
                </div>
            </aside>
        </div>
    </div>

    <!-- Reply Modal -->
    <div class="modal" id="replyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Reply to Email</h2>
                <button class="modal-close" id="replyClose">&times;</button>
            </div>
            <div class="modal-body">
                <form id="replyForm">
                    <div class="mb-3">
                        <label for="replyTo" class="form-label">To:</label>
                        <input type="text" id="replyTo" class="form-control" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="replySubject" class="form-label">Subject:</label>
                        <input type="text" id="replySubject" class="form-control" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="replyBody" class="form-label">Message:</label>
                        <textarea id="replyBody" class="form-control" rows="6" required></textarea>
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="replyAll">
                            <label class="form-check-label" for="replyAll">Reply to all</label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <div class="btn-group">
                    <button class="btn btn-secondary" id="replyCancel">Cancel</button>
                    <button class="btn btn-primary" id="replySend">Send</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // Configuration
        const API_BASE = '/api';
        const DEFAULT_ACCOUNT = 'personal'; // Will be dynamically determined
        let currentAccount = null;
        let emails = [];
        let filteredEmails = [];
        let currentFilter = 'all';
        let searchQuery = '';
        let selectedEmailId = null;
        let importanceInitialized = false; // auto-run AI scoring once per session

        // DOM Elements
        const authStatus = document.getElementById('authStatus');
        const authStatusText = document.getElementById('authStatusText');
        const authBtn = document.getElementById('authBtn');
        const stats = {
            unread: document.getElementById('unreadCount'),
            important: document.getElementById('importantCount'),
            total: document.getElementById('totalCount')
        };
        const searchInput = document.getElementById('searchInput');
        const filterButtons = {
            all: document.getElementById('filterAll'),
            unread: document.getElementById('filterUnread'),
            important: document.getElementById('filterImportant'),
            starred: document.getElementById('filterStarred')
        };
        const refreshBtn = document.getElementById('refreshBtn');
        const emailList = document.getElementById('emailList');
        const loadingState = document.getElementById('loadingState');
        const emptyState = document.getElementById('emptyState');
        const replyModal = document.getElementById('replyModal');
        const replyClose = document.getElementById('replyClose');
        const replyCancel = document.getElementById('replyCancel');
        const replySend = document.getElementById('replySend');
        const replyForm = document.getElementById('replyForm');
        const replyTo = document.getElementById('replyTo');
        const replySubject = document.getElementById('replySubject');
        const replyBody = document.getElementById('replyBody');
        const replyAllCheckbox = document.getElementById('replyAll');
        const toast = document.getElementById('toast');

        // New UI refs (surgical additions)
        const modelBadge = document.getElementById('modelBadge');
        const detailPane = document.getElementById('detailPane');
        const toneSelect = document.getElementById('toneSelect');
        const draftReplyBtn = document.getElementById('draftReplyBtn');
        const refreshImportanceBtn = document.getElementById('refreshImportanceBtn');
        const detailSubject = document.getElementById('detailSubject');
        const detailFrom = document.getElementById('detailFrom');
        const detailDate = document.getElementById('detailDate');
        const detailBody = document.getElementById('detailBody');
        const summaryLoading = document.getElementById('summaryLoading');
        const summaryText = document.getElementById('summaryText');
        const keyPointsList = document.getElementById('keyPointsList');
        const suggestedAction = document.getElementById('suggestedAction');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Check URL params for auth result
            const params = new URLSearchParams(window.location.search);
            if (params.get('auth') === 'success') {
                showToast('Account connected successfully!', 'success');
                // Clean URL without reload
                window.history.replaceState({}, '', window.location.pathname);
            } else if (params.get('auth') === 'failed') {
                showToast('Authentication failed: ' + (params.get('reason') || 'Unknown error'), 'error');
                window.history.replaceState({}, '', window.location.pathname);
            }
            // initAuth() is async — gate email loading on it so the account is
            // resolved first (pre-existing race: loadEmails() saw a null account
            // and showed "Please connect" on every first load).
            initAuth().then(() => {
                loadStats();
                loadEmails();
            });
            setupEventListeners();
            loadConfig();
            
            // Auto-refresh every 2 minutes
            setInterval(() => {
                if (!document.hidden) { // Only refresh when tab is visible
                    loadEmails();
                    loadStats();
                }
            }, 120000);
        });

        // Authentication
        async function initAuth() {
            try {
                const response = await fetch(`${API_BASE}/auth/status`);
                const data = await response.json();
                
                // Find first authenticated account
                const authedAccount = data.accounts.find(acc => acc.authenticated);
                if (authedAccount) {
                    currentAccount = authedAccount.id;
                    updateAuthStatus(true, authedAccount.email);
                } else {
                    currentAccount = null;
                    updateAuthStatus(false);
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                updateAuthStatus(false);
            }
        }

        function updateAuthStatus(isConnected, email = '') {
            if (isConnected) {
                authStatus.className = 'auth-status connected';
                authStatusText.textContent = `Connected as ${email}`;
                authBtn.textContent = 'Disconnect';
                authBtn.onclick = logout;
            } else {
                authStatus.className = 'auth-status disconnected';
                authStatusText.textContent = 'Not connected';
                authBtn.textContent = 'Connect Account';
                authBtn.onclick = login;
            }
        }

        async function login() {
            authBtn.disabled = true;
            authBtn.textContent = 'Connecting...';
            
            try {
                const statusResp = await fetch(`${API_BASE}/auth/status`);
                const statusData = await statusResp.json();
                const accounts = statusData.accounts || [];
                if (accounts.length === 0) {
                    showToast('No accounts configured', 'error');
                    return;
                }
                // Find first unauthed account, or fall back to first account
                const account = statusData.accounts.find(a => a.needsAuth) || accounts[0];
                
                const response = await fetch(`${API_BASE}/auth/${account.id}/url`);
                const data = await response.json();
                if (data.authUrl) {
                    // Redirect the current page to Google auth — avoids popup blocker
                    window.location.href = data.authUrl;
                }
            } catch (error) {
                console.error('Auth error:', error);
                showToast('Authentication failed', 'error');
                authBtn.disabled = false;
                authBtn.textContent = 'Connect Account';
            }
        }

        async function logout() {
            authBtn.disabled = true;
            authBtn.textContent = 'Disconnecting...';
            
            try {
                await fetch(`${API_BASE}/auth/${currentAccount}/signout`);
                updateAuthStatus(false);
                showToast('Disconnected successfully', 'success');
            } catch (error) {
                console.error('Logout error:', error);
            } finally {
                authBtn.disabled = false;
                authBtn.textContent = 'Connect Account';
            }
        }

        // AI config / model badge
        async function loadConfig() {
            if (!modelBadge) return;
            try {
                const response = await fetch(`${API_BASE}/config`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const model = data.model || data.defaultModel;
                if (model) {
                    modelBadge.textContent = shortenModelName(model);
                    modelBadge.style.display = 'inline-flex';
                }
            } catch (error) {
                // Endpoint absent / 404 / network error — keep the badge hidden, degrade silently
                console.debug('AI config endpoint unavailable:', error);
            }
        }

        function shortenModelName(model) {
            if (!model) return 'AI';
            let name = String(model).split('/').pop() || String(model);
            return name.replace(/-(instruct|chat|latest|it|q4[_k0-9]+|gguf|fp16|bf16|8bit|4bit)$/i, '');
        }

        // AI importance scoring (degrades gracefully when the endpoint is absent)
        async function refreshImportance(isAuto) {
            if (!emails.length || !currentAccount) {
                showToast('No emails to analyze', 'error');
                return;
            }
            const visibleIds = (filteredEmails.length ? filteredEmails : emails).map(e => e.id);
            const rows = emailList.querySelectorAll('.email-item');
            rows.forEach(r => r.classList.add('analyzing'));
            if (refreshImportanceBtn) {
                refreshImportanceBtn.disabled = true;
                refreshImportanceBtn.textContent = '⏳ Analyzing...';
            }
            try {
                const response = await fetch(`${API_BASE}/importance/refresh`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids: visibleIds, accountId: currentAccount })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const scores = data.scores || [];
                scores.forEach(s => {
                    const email = emails.find(e => e.id === s.emailId);
                    if (!email) return;
                    if (typeof s.llmScore === 'number') email.llmScore = s.llmScore;
                    if (s.reason) email.llmReason = s.reason;
                    if (typeof s.isImportant === 'boolean') email.isImportant = s.isImportant;
                    // Targeted in-place DOM update — no full list rebuild
                    const rowEl = findEmailRow(s.emailId);
                    if (rowEl) updateEmailRowImportance(email, rowEl);
                });
                if (data.model && modelBadge) {
                    modelBadge.textContent = shortenModelName(data.model);
                    modelBadge.style.display = 'inline-flex';
                }
                if (selectedEmailId) {
                    const sel = emails.find(e => e.id === selectedEmailId);
                    if (sel) renderDetailImportance(sel);
                }
                showToast(scores.length ? `Analyzed ${scores.length} emails` : 'Importance analysis completed', 'success');
            } catch (error) {
                console.debug('Importance refresh unavailable:', error);
                if (!isAuto) showToast('AI analysis failed', 'error');
            } finally {
                rows.forEach(r => r.classList.remove('analyzing'));
                if (refreshImportanceBtn) {
                    refreshImportanceBtn.disabled = false;
                    refreshImportanceBtn.textContent = '✨ Analyze';
                }
            }
        }

        // Stats
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats?account=${currentAccount || ''}`);
                const data = await response.json();
                
                stats.unread.textContent = data.unreadCount || 0;
                stats.important.textContent = data.importantCount || 0;
                stats.total.textContent = data.totalInbox || 0;
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        // Email loading
        async function loadEmails() {
            if (!currentAccount) {
                showEmptyState('Please connect your email account');
                return;
            }
            
            showLoading();
            
            try {
                const params = new URLSearchParams({
                    account: currentAccount,
                    query: searchQuery,
                    maxResults: 50
                });
                
                const response = await fetch(`${API_BASE}/emails?${params}`);
                const data = await response.json();
                
                emails = data.emails || [];
                applyFilters();
                renderEmailList();

                // Auto-run AI importance scoring once after the first successful load
                if (!importanceInitialized && filteredEmails.length) {
                    importanceInitialized = true;
                    refreshImportance(true);
                }
                
            } catch (error) {
                console.error('Failed to load emails:', error);
                showErrorState('Failed to load emails. Please try again.');
            }
        }

        function applyFilters() {
            filteredEmails = emails.filter(email => {
                // Text search
                const matchesSearch = 
                    email.subject.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    email.from.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    email.snippet.toLowerCase().includes(searchQuery.toLowerCase());
                
                // Filter by type
                const matchesFilter = 
                    currentFilter === 'all' ||
                    (currentFilter === 'unread' && email.isUnread) ||
                    (currentFilter === 'important' && email.isImportant) ||
                    (currentFilter === 'starred' && email.labels.includes('STARRED'));
                
                return matchesSearch && matchesFilter;
            });
            
            // Sort by importance first, then by date descending
            filteredEmails.sort((a, b) => {
                if (a.isImportant !== b.isImportant) {
                    return b.isImportant ? 1 : -1; // Important first
                }
                return new Date(b.date) - new Date(a.date); // Newer first
            });
        }

        function renderEmailList() {
            if (filteredEmails.length === 0) {
                showEmptyState('No emails match your filters');
                return;
            }
            
            emailList.innerHTML = '';
            const fragment = document.createDocumentFragment();
            
            filteredEmails.forEach(email => {
                const emailEl = createEmailElement(email);
                fragment.appendChild(emailEl);
            });
            
            emailList.appendChild(fragment);
            
            // Re-apply the selected-row highlight after a rebuild
            if (selectedEmailId) {
                emailList.querySelectorAll('.email-item').forEach(el => {
                    el.classList.toggle('selected', el.dataset.emailId === selectedEmailId);
                });
            }
            hideLoading();
        }

        function createEmailElement(email) {
            const div = document.createElement('div');
            div.className = `email-item ${email.isUnread ? 'unread' : ''} ${email.isImportant ? 'important' : ''}`;
            div.dataset.emailId = email.id;
            
            // Check if starred
            const isStarred = email.labels.includes('STARRED');
            
            div.innerHTML = `
                <input type="checkbox" class="email-checkbox" ${email.isUnread ? '' : 'checked'}>
                <div class="email-content">
                    <div class="email-header">
                        <div class="email-subject">${escapeHtml(email.subject)}</div>
                        <div class="email-date">${formatDate(new Date(email.date))}</div>
                    </div>
                    <div class="email-from">${escapeHtml(email.from)}</div>
                    <div class="email-snippet">${escapeHtml(email.snippet)}</div>
                    <div class="email-tags">
                        ${email.isImportant ? '<span class="tag importance">⚡ Important</span>' : ''}
                        ${email.isUnread ? '<span class="tag unread">📧 New</span>' : ''}
                        ${isStarred ? '<span class="tag starred">⭐ Starred</span>' : ''}
                        ${email.labels.filter(l => !['INBOX', 'UNREAD', 'STARRED', 'IMPORTANT'].includes(l)).map(l => `
                            <span class="tag label">${escapeHtml(l)}</span>`).join('')}
                    </div>
                    <div class="email-actions">
                        <button class="action-btn" data-action="toggle-read" title="${email.isUnread ? 'Mark as read' : 'Mark as unread'}">
                            ${email.isUnread ? '📖' : '📭'}
                        </button>
                        <button class="action-btn" data-action="toggle-star" title="${isStarred ? 'Unstar' : 'Star'}">
                            ${isStarred ? '⭐' : '☆'}
                        </button>
                        <button class="action-btn" data-action="archive" title="Archive">
                            📦
                        </button>
                        <button class="action-btn" data-action="toggle-important" title="${email.isImportant ? 'Remove important' : 'Mark as important'}">
                            ${email.isImportant ? '⚡' : '○'}
                        </button>
                        <button class="action-btn" data-action="reply" title="Reply">
                            ↩️
                        </button>
                    </div>
                </div>
            `;
            
            // AI importance chip + reason tooltip (appended after the template —
            // leaves the nested template literal ~L867 untouched)
            if (typeof email.llmScore === 'number') {
                const tags = div.querySelector('.email-tags');
                if (tags) {
                    const chip = document.createElement('span');
                    chip.className = 'score-chip' + (email.llmScore >= 70 ? '' : email.llmScore >= 40 ? ' mid' : ' low');
                    chip.textContent = Math.round(email.llmScore);
                    tags.appendChild(chip);
                    if (email.llmReason) {
                        const badge = document.createElement('span');
                        badge.className = 'llm-badge';
                        badge.dataset.reason = email.llmReason;
                        badge.textContent = 'AI';
                        tags.appendChild(badge);
                    }
                }
            }
            
            // Add event listeners
            const checkbox = div.querySelector('.email-checkbox');
            checkbox.addEventListener('change', (e) => {
                e.stopPropagation();
                toggleRead(email.id, !email.isUnread);
            });
            
            div.querySelectorAll('.email-actions button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const action = btn.dataset.action;
                    handleEmailAction(email.id, action);
                });
            });
            
            // Click to expand/view email
            div.addEventListener('click', (e) => {
                if (!e.target.closest('.email-actions button') && e.target !== checkbox) {
                    showEmailDetail(email);
                }
            });
            
            return div;
        }

        function handleEmailAction(emailId, action) {
            const email = emails.find(e => e.id === emailId);
            if (!email) return;
            
            fetch(`${API_BASE}/email/${emailId}/action`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    action,
                    accountId: currentAccount
                })
            })
            .then(async (res) => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            })
            .then(data => {
                if (data.success) {
                    // Optimistically update UI
                    switch (action) {
                        case 'toggle-read':
                            email.isUnread = !email.isUnread;
                            break;
                        case 'toggle-star':
                            const starIndex = email.labels.indexOf('STARRED');
                            if (starIndex > -1) {
                                email.labels.splice(starIndex, 1);
                            } else {
                                email.labels.push('STARRED');
                            }
                            break;
                        case 'archive':
                            email.labels = email.labels.filter(l => l !== 'INBOX');
                            break;
                        case 'toggle-important':
                            email.isImportant = !email.isImportant;
                            break;
                    }
                    
                    applyFilters();
                    renderEmailList();
                    loadStats();
                    showToast(`Email ${action}ed`, 'success');
                }
            })
            .catch(error => {
                console.error('Action failed:', error);
                showToast('Action failed', 'error');
            });
        }

        // Search and filters
        function setupEventListeners() {
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                applyFilters();
                renderEmailList();
            });
            
            Object.keys(filterButtons).forEach(key => {
                filterButtons[key].addEventListener('click', () => {
                    // Update active button
                    Object.values(filterButtons).forEach(btn => btn.classList.remove('active'));
                    filterButtons[key].classList.add('active');
                    
                    currentFilter = key;
                    applyFilters();
                    renderEmailList();
                });
            });
            
            refreshBtn.addEventListener('click', () => {
                refreshBtn.disabled = true;
                refreshBtn.innerHTML = '🔄 Refreshing...';
                loadEmails().finally(() => {
                    refreshBtn.disabled = false;
                    refreshBtn.innerHTML = '🔄 Refresh';
                });
            });
            
            // Smart reply + AI importance analysis
            if (draftReplyBtn) {
                draftReplyBtn.addEventListener('click', draftReply);
            }
            if (refreshImportanceBtn) {
                refreshImportanceBtn.addEventListener('click', refreshImportance);
            }
            
            // Reply modal
            replyClose.addEventListener('click', () => {
                replyModal.style.display = 'none';
            });
            
            replyCancel.addEventListener('click', () => {
                replyModal.style.display = 'none';
            });
            
            replyForm.addEventListener('submit', (e) => {
                e.preventDefault();
                sendReply();
            });
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && replyModal.style.display === 'flex') {
                    replyModal.style.display = 'none';
                }
                if (e.key === 'r' && !e.ctrlKey && !e.metaKey && !e.shiftKey && selectedEmailId) {
                    e.preventDefault();
                    replyToEmail(selectedEmailId);
                }
            });
        }

        // Email detail view
        async function renderDetail(email) {
            selectedEmailId = email.id;

            // Highlight selected email row
            document.querySelectorAll('.email-item').forEach(el => {
                el.classList.toggle('selected', el.dataset.emailId === email.id);
            });

            if (!detailPane) return;
            detailPane.style.display = 'block';

            // Optimistic fill from list data
            populateDetailMeta(email);
            renderDetailImportance(email);
            detailBody.textContent = email.snippet || '';

            // Fetch fresh email data (may include optional llmScore / llmReason)
            try {
                const response = await fetch(`${API_BASE}/email/${encodeURIComponent(email.id)}?account=${encodeURIComponent(currentAccount || '')}`);
                if (response.ok) {
                    const data = await response.json();
                    const fresh = data.email || data;
                    if (fresh && typeof fresh === 'object') {
                        populateDetailMeta(fresh);
                        if (typeof fresh.llmScore === 'number') {
                            email.llmScore = fresh.llmScore;
                            email.llmReason = fresh.llmReason || email.llmReason;
                        }
                        renderDetailImportance(email);
                        if (fresh.body) {
                            if (/<[a-z][\s\S]*>/i.test(fresh.body)) {
                                detailBody.innerHTML = fresh.body;
                            } else {
                                detailBody.textContent = fresh.body;
                            }
                        }
                        // Sync the row badge if the fresh payload added a score
                        const rowEl = findEmailRow(email.id);
                        if (rowEl) updateEmailRowImportance(email, rowEl);
                    }
                }
            } catch (error) {
                console.error('Failed to load email detail:', error);
            }

            // Fetch AI summary (degrades gracefully when the endpoint is absent)
            try {
                const response = await fetch(`${API_BASE}/summary/${encodeURIComponent(email.id)}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                renderSummary(data);
            } catch (error) {
                console.debug('Summary endpoint unavailable:', error);
                renderSummaryUnavailable();
            }
        }

        // Backwards-compatible entry point (kept so the existing click handler works)
        function showEmailDetail(email) {
            renderDetail(email);
        }

        function populateDetailMeta(data) {
            if (!data) return;
            detailSubject.textContent = data.subject || '(No subject)';
            detailFrom.textContent = data.from ? 'From: ' + data.from : '';
            detailDate.textContent = data.date ? formatDate(new Date(data.date)) : '';
        }

        function renderDetailImportance(email) {
            const row = document.getElementById('detailImportance');
            if (!row) return;
            row.innerHTML = '';
            const frag = document.createDocumentFragment();

            if (email.isImportant) {
                const chip = document.createElement('span');
                chip.className = 'tag importance';
                chip.textContent = '⚡ Important';
                frag.appendChild(chip);
            }
            if (typeof email.llmScore === 'number') {
                const chip = document.createElement('span');
                chip.className = 'score-chip' + (email.llmScore >= 70 ? '' : email.llmScore >= 40 ? ' mid' : ' low');
                chip.textContent = 'AI ' + Math.round(email.llmScore);
                if (email.llmReason) {
                    chip.classList.add('reason-tooltip');
                    chip.dataset.reason = email.llmReason;
                }
                frag.appendChild(chip);
            }
            if (!email.isImportant && typeof email.llmScore !== 'number') {
                const muted = document.createElement('span');
                muted.className = 'detail-muted';
                muted.textContent = 'No AI assessment yet';
                frag.appendChild(muted);
            }
            row.appendChild(frag);
        }

        function renderSummary(data) {
            summaryLoading.style.display = 'none';
            summaryText.className = 'summary-text';
            summaryText.textContent = (data && data.summary) || 'No summary available.';
            keyPointsList.innerHTML = '';
            ((data && data.keyPoints) || []).forEach(point => {
                const li = document.createElement('li');
                li.textContent = point;
                keyPointsList.appendChild(li);
            });
            suggestedAction.innerHTML = '';
            if (data && data.suggestedAction) {
                const chip = document.createElement('div');
                chip.className = 'suggested-action';
                chip.textContent = '💡 Suggested: ' + data.suggestedAction;
                suggestedAction.appendChild(chip);
            }
        }

        function renderSummaryUnavailable() {
            summaryLoading.style.display = 'none';
            summaryText.className = 'summary-unavailable';
            summaryText.textContent = 'Summary unavailable';
            keyPointsList.innerHTML = '';
            suggestedAction.innerHTML = '';
        }

        function findEmailRow(emailId) {
            const rows = emailList.querySelectorAll('.email-item');
            for (const row of rows) {
                if (row.dataset.emailId === emailId) return row;
            }
            return null;
        }

        function updateEmailRowImportance(email, rowEl) {
            if (!rowEl) return;
            const tags = rowEl.querySelector('.email-tags');
            if (!tags) return;

            // Remove stale AI chips
            tags.querySelectorAll('.score-chip, .llm-badge').forEach(el => el.remove());

            // Keep the importance tag in sync
            const impTag = tags.querySelector('.tag.importance');
            if (email.isImportant && !impTag) {
                const chip = document.createElement('span');
                chip.className = 'tag importance';
                chip.textContent = '⚡ Important';
                tags.insertBefore(chip, tags.firstChild);
            } else if (!email.isImportant && impTag) {
                impTag.remove();
            }
            rowEl.classList.toggle('important', !!email.isImportant);

            // Add AI score chip + reason tooltip when the LLM has scored this email
            if (typeof email.llmScore === 'number') {
                const chip = document.createElement('span');
                chip.className = 'score-chip' + (email.llmScore >= 70 ? '' : email.llmScore >= 40 ? ' mid' : ' low');
                chip.textContent = Math.round(email.llmScore);
                tags.appendChild(chip);
                if (email.llmReason) {
                    const badge = document.createElement('span');
                    badge.className = 'llm-badge';
                    badge.dataset.reason = email.llmReason;
                    badge.textContent = 'AI';
                    tags.appendChild(badge);
                }
            }
        }

        function replyToEmail(emailId) {
            const email = emails.find(e => e.id === emailId);
            if (!email) return;
            
            // Show reply modal
            replyModal.style.display = 'flex';
            
            // Prefill form
            replyTo.value = extractEmailAddress(email.from);
            replySubject.value = `Re: ${email.subject.startsWith('Re: ') ? email.subject : 'Re: ' + email.subject}`;
            replyBody.value = ''; // Start empty
            replyAllCheckbox.checked = false; // Default to reply-only
            
            // Focus on body
            setTimeout(() => replyBody.focus(), 100);
        }

        function extractEmailAddress(from) {
            const match = from.match(/<([^>]+)>/);
            return match ? match[1] : from.trim();
        }

        async function sendReply() {
            if (!selectedEmailId) return;
            
            const body = replyBody.value.trim();
            if (!body) {
                showToast('Please enter a reply', 'error');
                return;
            }
            
            replySend.disabled = true;
            replySend.textContent = 'Sending...';
            
            try {
                const response = await fetch(`${API_BASE}/email/${selectedEmailId}/reply`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        body,
                        accountId: currentAccount,
                    })
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                if (data.success) {
                    replyModal.style.display = 'none';
                    replyForm.reset();
                    showToast('Reply sent!', 'success');
                    // Optionally refresh to see sent email in sent folder
                }
            } catch (error) {
                console.error('Reply failed:', error);
                showToast('Failed to send reply', 'error');
            } finally {
                replySend.disabled = false;
                replySend.textContent = 'Send';
            }
        }

        // Smart-reply draft via LLM (degrades gracefully when the endpoint is absent)
        async function draftReply() {
            if (!selectedEmailId) {
                showToast('Select an email first', 'error');
                return;
            }
            const email = emails.find(e => e.id === selectedEmailId);
            if (!email) {
                showToast('Email no longer in the list', 'error');
                return;
            }
            const tone = toneSelect ? toneSelect.value : 'professional';
            draftReplyBtn.disabled = true;
            draftReplyBtn.textContent = '⏳ Drafting...';
            try {
                const response = await fetch(`${API_BASE}/reply/draft`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messageId: selectedEmailId, tone, accountId: currentAccount })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (!data.reply) {
                    showToast('Could not generate a draft', 'error');
                    return;
                }
                // Prefill the existing reply modal for review before sending
                replyTo.value = extractEmailAddress(email.from);
                replySubject.value = `Re: ${email.subject.startsWith('Re: ') ? email.subject : 'Re: ' + email.subject}`;
                replyBody.value = data.reply;
                replyAllCheckbox.checked = false;
                replyModal.style.display = 'flex';
                setTimeout(() => replyBody.focus(), 100);
                showToast('Draft ready for review', 'success');
            } catch (error) {
                console.error('Draft failed:', error);
                showToast('Failed to draft reply', 'error');
            } finally {
                draftReplyBtn.disabled = false;
                draftReplyBtn.textContent = '✨ Draft Reply';
            }
        }

        // UI Helpers
        function showLoading() {
            loadingState.style.display = 'block';
            emailList.style.display = 'block';
            emptyState.style.display = 'none';
            // Re-attach skeleton/empty state if renderEmailList detached them
            if (!loadingState.isConnected) emailList.appendChild(loadingState);
            if (!emptyState.isConnected) emailList.appendChild(emptyState);
        }
        
        function hideLoading() {
            loadingState.style.display = 'none';
            emailList.style.display = 'block';
            emptyState.style.display = 'none';
        }
        
        function showEmptyState(message) {
            loadingState.style.display = 'none';
            emailList.style.display = 'none';
            emptyState.style.display = 'block';
            emptyState.querySelector('p').textContent = message;
        }
        
        function showErrorState(message) {
            loadingState.style.display = 'none';
            emailList.style.display = 'none';
            emptyState.style.display = 'block';
            emptyState.querySelector('.empty-state-icon').textContent = '❌';
            emptyState.querySelector('p:first-child').textContent = 'Error';
            emptyState.querySelector('p:last-child').textContent = message;
        }
        
        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.style.display = 'block';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatDate(date) {
            const now = new Date();
            const diff = now - date;
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const days = Math.floor(hours / 24);
            
            if (days > 7) {
                return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
            } else if (days > 0) {
                return `${days}d ago`;
            } else if (hours > 0) {
                return `${hours}h ago`;
            } else {
                const minutes = Math.floor(diff / (1000 * 60));
                return `${minutes}m ago`;
            }
        }
    </script>
</body>
</html>
